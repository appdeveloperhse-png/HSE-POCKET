
name: HSE Management Android (PySide6)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl \
            build-essential cmake \
            autoconf automake libtool pkg-config \
            libffi-dev libssl-dev zlib1g-dev \
            libsqlite3-dev liblzma-dev \
            libncurses5-dev libncursesw5-dev \
            libreadline-dev libbz2-dev \
            libgdbm-dev libdb-dev libexpat1-dev

      - name: Check application source
        run: |
          set -eux
          test -f main.py
          grep -q "from PySide6" main.py
          grep -q "QApplication" main.py
          python -m py_compile main.py

          echo "PySide6 source and Python syntax check passed."

      - name: Install Qt for Python deployment tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "PySide6==6.10.1"

          python -c "import PySide6; print(PySide6.__version__)"
          pyside6-android-deploy --help

      - name: Download Android SDK, NDK and Android Python
        run: |
          git clone --depth 1 --branch 6.10 \
            https://code.qt.io/pyside/pyside-setup.git \
            "$RUNNER_TEMP/pyside-setup"

          python -m pip install \
            -r "$RUNNER_TEMP/pyside-setup/requirements.txt" \
            -r "$RUNNER_TEMP/pyside-setup/tools/cross_compile_android/requirements.txt"

          python "$RUNNER_TEMP/pyside-setup/tools/cross_compile_android/main.py" \
            --download-only \
            --skip-update \
            --auto-accept-license

      - name: Download Android PySide6 wheels
        run: |
          set -eux

          qtpip download PySide6 --android --arch aarch64

          echo "Searching for Android wheels..."
          find . "$HOME" -type f \
            \( -iname '*pyside6*android*aarch64*.whl' \
            -o -iname '*shiboken6*android*aarch64*.whl' \) \
            -print 2>/dev/null | head -100

          PYSIDE_WHEEL="$(find . "$HOME" -type f \
            -iname '*pyside6*android*aarch64*.whl' \
            -print -quit 2>/dev/null || true)"

          SHIBOKEN_WHEEL="$(find . "$HOME" -type f \
            -iname '*shiboken6*android*aarch64*.whl' \
            -print -quit 2>/dev/null || true)"

          if [ -z "$PYSIDE_WHEEL" ] || [ -z "$SHIBOKEN_WHEEL" ]; then
            echo "::error::Required Android PySide6/Shiboken wheels were not found."
            echo "Inspect the qtpip output and official Qt Android wheel instructions."
            exit 1
          fi

          echo "PYSIDE_WHEEL=$PYSIDE_WHEEL" >> "$GITHUB_ENV"
          echo "SHIBOKEN_WHEEL=$SHIBOKEN_WHEEL" >> "$GITHUB_ENV"

      - name: Build Android APK
        run: |
          set -eux

          pyside6-android-deploy \
            --name "HSE Management" \
            --wheel-pyside "$PYSIDE_WHEEL" \
            --wheel-shiboken "$SHIBOKEN_WHEEL" \
            --keep-deployment-files

      - name: Find and validate APK
        if: success()
        run: |
          set -eux

          mkdir -p output

          find . -type f -name '*.apk' \
            -not -path './.git/*' \
            -not -path './output/*' \
            -exec cp {} output/ \;

          test -n "$(find output -maxdepth 1 -name '*.apk' -print -quit)"

          ls -lh output/*.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Management-PySide6-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Management-Build-Diagnostics
          path: |
            .buildozer/
            buildozer.log
          if-no-files-found: ignore
          retention-days: 7
