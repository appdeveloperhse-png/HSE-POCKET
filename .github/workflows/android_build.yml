name: Build HSE Management System APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            gettext \
            autopoint

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer
          pip install "Cython==0.29.34"

      - name: Show versions
        run: |
          python --version
          buildozer --version
          java -version

      - name: Clean old Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Prepare FreeType download
        run: |
          set -e

          FREETYPE_VERSION="2.14.1"
          FREETYPE_FILE="freetype-${FREETYPE_VERSION}.tar.gz"

          mkdir -p "$HOME/.buildozer/android/packages/freetype"

          echo "=========================================="
          echo "Downloading FreeType"
          echo "File: $FREETYPE_FILE"
          echo "=========================================="

          curl -4 -L \
            --fail \
            --show-error \
            --location \
            --connect-timeout 30 \
            --max-time 300 \
            --retry 10 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://download.savannah.gnu.org/releases/freetype/$FREETYPE_FILE" \
            -o "$HOME/.buildozer/android/packages/freetype/$FREETYPE_FILE"

          echo "=========================================="
          echo "Checking FreeType archive"
          echo "=========================================="

          ls -lh "$HOME/.buildozer/android/packages/freetype/$FREETYPE_FILE"

          file "$HOME/.buildozer/android/packages/freetype/$FREETYPE_FILE"

          tar -tzf \
            "$HOME/.buildozer/android/packages/freetype/$FREETYPE_FILE" \
            >/dev/null

          touch \
            "$HOME/.buildozer/android/packages/freetype/.mark-$FREETYPE_FILE"

          echo "FreeType prepared successfully."

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Search APK
        if: always()
        run: |
          echo "=========================================="
          echo "APK SEARCH"
          echo "=========================================="

          find . -type f -name "*.apk" -print

          echo "=========================================="
          echo "BIN DIRECTORY"
          echo "=========================================="

          ls -lah bin 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Management-System-APK
          path: bin/*.apk
          if-no-files-found: error
