name: Build HSE-POCKET APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

      ANDROIDAPI: "35"
      ANDROIDMINAPI: "24"

      ANDROIDNDK: /home/runner/.buildozer/android/platform/android-ndk-r28c
      ANDROID_NDK: /home/runner/.buildozer/android/platform/android-ndk-r28c
      ANDROID_NDK_ROOT: /home/runner/.buildozer/android/platform/android-ndk-r28c
      ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk-r28c

      P4A_freetype_DIR: /home/runner/freetype-source
      PACKAGES_PATH: /home/runner/.buildozer/android/packages

      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m"

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 2. JAVA 17
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # 3. PYTHON 3.11
      # ==========================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================================
      # 4. BUILD DEPENDENCIES
      # ==========================================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install buildozer==1.6.0

          pip install "Cython==0.29.34"

          buildozer --version
          python --version


      # ==========================================================
      # 5. CHECK PROJECT
      # ==========================================================
      - name: Check project
        run: |
          test -f main.py
          test -f buildozer.spec
          test -f requirements.txt

          python -m py_compile main.py

          echo "Project check passed."


      # ==========================================================
      # 6. FREETYPE
      # ==========================================================
      - name: Prepare FreeType
        run: |
          rm -rf "$HOME/freetype-source"

          git clone \
            --depth 1 \
            --branch VER-2-14-1 \
            https://github.com/freetype/freetype.git \
            "$HOME/freetype-source"

          test -f "$HOME/freetype-source/CMakeLists.txt"

          echo "FreeType ready."


      # ==========================================================
      # 7. PREPARE SDK
      # ==========================================================
      - name: Prepare Android SDK
        run: |
          rm -rf "$ANDROIDSDK"

          mkdir -p "$ANDROIDSDK"

          cp -a /usr/local/lib/android/sdk/. "$ANDROIDSDK/"

          echo "SDK copied."


      # ==========================================================
      # 8. REMOVE ALL NDK VERSIONS FROM COPIED SDK
      #
      # This is important.
      #
      # The previous build selected:
      # 25.1.8937393
      #
      # We do NOT want that.
      # ==========================================================
      - name: Remove conflicting NDKs
        run: |
          echo "NDK directories before cleanup:"

          find "$ANDROIDSDK/ndk" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -print || true

          rm -rf "$ANDROIDSDK/ndk"

          mkdir -p "$ANDROIDSDK/ndk"

          echo "All system NDKs removed."


      # ==========================================================
      # 9. SDKMANAGER
      # ==========================================================
      - name: Prepare sdkmanager
        run: |
          mkdir -p "$ANDROIDSDK/tools/bin"

          if [ -f "$ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -sf \
              "$ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager" \
              "$ANDROIDSDK/tools/bin/sdkmanager"
          fi

          test -f "$ANDROIDSDK/tools/bin/sdkmanager"

          echo "sdkmanager ready."


      # ==========================================================
      # 10. LICENSES
      # ==========================================================
      - name: Accept Android licenses
        run: |
          SDKMANAGER="$ANDROIDSDK/tools/bin/sdkmanager"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROIDSDK" \
            --licenses || true

          echo "Licenses processed."


      # ==========================================================
      # 11. ANDROID PLATFORM + BUILD TOOLS
      # ==========================================================
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROIDSDK/tools/bin/sdkmanager"

          "$SDKMANAGER" \
            --sdk_root="$ANDROIDSDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          echo "SDK packages ready."


      # ==========================================================
      # 12. VERIFY SDK
      # ==========================================================
      - name: Verify SDK
        run: |
          test -d "$ANDROIDSDK/platforms/android-35"
          test -d "$ANDROIDSDK/build-tools/37.0.0"
          test -f "$ANDROIDSDK/build-tools/37.0.0/aidl"

          echo "SDK verification passed."


      # ==========================================================
      # 13. CLEAN BUILDOZER
      # ==========================================================
      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

          echo "Buildozer cache cleaned."


      # ==========================================================
      # 14. BUILD
      #
      # Buildozer/p4a will install the NDK specified by:
      #
      # android.ndk = 28c
      #
      # ==========================================================
      - name: Build APK
        shell: bash
        run: |

          set +e

          export ANDROIDSDK="$ANDROIDSDK"
          export ANDROID_HOME="$ANDROIDSDK"
          export ANDROID_SDK_ROOT="$ANDROIDSDK"

          export ANDROIDAPI="35"
          export ANDROIDMINAPI="24"

          export P4A_freetype_DIR="$HOME/freetype-source"

          # Force Buildozer/p4a to use the requested NDK.
          unset ANDROID_NDK
          unset ANDROID_NDK_ROOT
          unset ANDROID_NDK_HOME
          unset ANDROIDNDK

          echo "=========================================="
          echo "BUILD CONFIGURATION"
          echo "=========================================="

          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"

          echo ""
          echo "Buildozer will use:"
          grep -E \
            "android.api|android.minapi|android.ndk|android.archs|android.sdk_path" \
            buildozer.spec

          echo ""
          echo "=========================================="
          echo "START BUILDOZER"
          echo "=========================================="

          buildozer -v android debug

          RESULT=$?

          if [ "$RESULT" -eq 0 ]; then
            echo ""
            echo "=========================================="
            echo "BUILD SUCCESSFUL"
            echo "=========================================="
            exit 0
          fi

          echo ""
          echo "=========================================="
          echo "BUILD FAILED"
          echo "=========================================="

          echo ""
          echo "Searching for NDK actually used..."

          find .buildozer \
            -type d \
            -name "25.1.8937393" \
            -print || true

          find .buildozer \
            -type d \
            -name "*android-ndk*" \
            -print || true

          echo ""
          echo "Searching for SDL2..."

          find .buildozer \
            -type d \
            -iname "*SDL2*" \
            -print || true

          exit "$RESULT"


      # ==========================================================
      # 15. APK
      # ==========================================================
      - name: Find APK
        if: success()
        run: |
          find bin \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(find bin -type f -name '*.apk' -print -quit)"

          echo "APK generated."


      # ==========================================================
      # 16. UPLOAD
      # ==========================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HSE-POCKET-APK
          path: bin/*.apk
          if-no-files-found: error
