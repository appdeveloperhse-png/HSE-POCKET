name: Build Android APK

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # SYSTEM DEPENDENCIES
      # ======================================================

      - name: Install system dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            python3 \
            python3-pip \
            python3-venv \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            libbz2-dev \
            liblzma-dev \
            libreadline-dev \
            libjpeg-dev \
            libpng-dev \
            libfreetype6-dev \
            cmake \
            gettext \
            autopoint


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Configure Python
        run: |

          python3 --version

          python3 -m pip install --upgrade pip setuptools wheel


      # ======================================================
      # BUILDOTOOLS
      # ======================================================

      - name: Install Buildozer and Cython
        run: |

          python3 -m pip install \
            buildozer==1.6.0 \
            "Cython==0.29.34"


      # ======================================================
      # FREE TYPE SOURCE
      #
      # Savannah download is unavailable in the runner.
      # Use GitHub source instead.
      # ======================================================

      - name: Prepare FreeType source
        run: |

          FREETYPE_DIR="$HOME/freetype-source"

          rm -rf "$FREETYPE_DIR"

          git clone \
            --depth 1 \
            --branch VER-2-14-1 \
            https://github.com/freetype/freetype.git \
            "$FREETYPE_DIR"

          echo "FreeType source prepared:"
          echo "$FREETYPE_DIR"

          test -f "$FREETYPE_DIR/CMakeLists.txt"


      # ======================================================
      # CLEAN PREVIOUS BUILD
      # ======================================================

      - name: Clean Buildozer
        run: |

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # ======================================================
      # BUILD APK
      # ======================================================

      - name: Build APK
        run: |

          export P4A_freetype_DIR="$HOME/freetype-source"

          echo "P4A FREETYPE SOURCE"
          echo "$P4A_freetype_DIR"

          test -d "$P4A_freetype_DIR"

          buildozer -v android debug


      # ======================================================
      # SHOW APK
      # ======================================================

      - name: List APK files
        if: always()
        run: |

          echo "APK files:"

          find bin \
            -type f \
            -name "*.apk" \
            -print || true


      # ======================================================
      # UPLOAD APK
      # ======================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4

        with:

          name: HSE-Management-APK

          path: |
            bin/*.apk

          if-no-files-found: error
