name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

      ANDROIDAPI: "35"
      ANDROIDMINAPI: "24"

      P4A_freetype_DIR: /home/runner/freetype-source
      PACKAGES_PATH: /home/runner/.buildozer/android/packages

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 3. Python
      # --------------------------------------------------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # 4. Install Buildozer
      # --------------------------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.6.0
          pip install "Cython==0.29.34"

      # --------------------------------------------------
      # 5. Create Buildozer Android directories
      # --------------------------------------------------
      - name: Prepare Android SDK directories
        run: |
          mkdir -p "$ANDROIDSDK"
          mkdir -p "$ANDROIDSDK/licenses"
          mkdir -p "$ANDROIDSDK/cmdline-tools"

          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      # --------------------------------------------------
      # 6. Copy GitHub runner Android SDK into Buildozer SDK
      # --------------------------------------------------
      - name: Prepare Android SDK
        run: |
          echo "System Android SDK:"
          ls -la /usr/local/lib/android/sdk

          echo "Copying system SDK to Buildozer SDK..."

          cp -a /usr/local/lib/android/sdk/. "$ANDROIDSDK/"

          echo "Buildozer Android SDK:"
          ls -la "$ANDROIDSDK"

      # --------------------------------------------------
      # 7. Accept ALL Android SDK licenses
      # --------------------------------------------------
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          yes | "$ANDROIDSDK/tools/bin/sdkmanager" --licenses || true

          echo "License directory:"
          find "$ANDROIDSDK/licenses" -maxdepth 1 -type f -print || true

      # --------------------------------------------------
      # 8. Install required Android SDK packages
      # --------------------------------------------------
      - name: Install Android SDK Build Tools and Platform
        run: |
          SDKMANAGER="$ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager"

          echo "Using:"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

      # --------------------------------------------------
      # 9. Verify AIDL
      # --------------------------------------------------
      - name: Verify Android Build Tools
        run: |
          echo "Checking Build Tools..."

          ls -la "$ANDROIDSDK/build-tools"

          AIDL="$ANDROIDSDK/build-tools/37.0.0/aidl"

          if [ ! -f "$AIDL" ]; then
            echo "ERROR: AIDL was not installed."
            exit 1
          fi

          echo "AIDL found:"
          ls -l "$AIDL"

          "$AIDL" --version

      # --------------------------------------------------
      # 10. FreeType source
      # --------------------------------------------------
      - name: Prepare FreeType source
        run: |
          rm -rf "$HOME/freetype-source"

          git clone --depth 1 \
            --branch VER-2-14-1 \
            https://github.com/freetype/freetype.git \
            "$HOME/freetype-source"

          echo "FreeType source:"
          ls -la "$HOME/freetype-source"

          test -f "$HOME/freetype-source/CMakeLists.txt"

      # --------------------------------------------------
      # 11. Check project files
      # --------------------------------------------------
      - name: Check project
        run: |
          echo "Repository:"
          pwd

          echo "Files:"
          find . -maxdepth 3 -type f | sort

          echo "main.py:"
          test -f main.py

          echo "buildozer.spec:"
          test -f buildozer.spec

      # --------------------------------------------------
      # 12. Python syntax check
      # --------------------------------------------------
      - name: Check main.py syntax
        run: |
          python -m py_compile main.py
          echo "main.py syntax OK"

      # --------------------------------------------------
      # 13. Show Buildozer configuration
      # --------------------------------------------------
      - name: Show Android environment
        run: |
          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"
          echo "P4A_freetype_DIR=$P4A_freetype_DIR"

          echo ""
          echo "SDK Build Tools:"
          ls -la "$ANDROIDSDK/build-tools"

          echo ""
          echo "AIDL:"
          "$ANDROIDSDK/build-tools/37.0.0/aidl" --version

      # --------------------------------------------------
      # 14. Clean old Buildozer state
      # --------------------------------------------------
      - name: Clean previous Android build state
        run: |
          rm -rf .buildozer
          rm -rf bin

      # --------------------------------------------------
      # 15. Build APK
      # --------------------------------------------------
      - name: Build APK
        run: |
          export ANDROIDSDK="$ANDROIDSDK"
          export ANDROID_HOME="$ANDROIDSDK"
          export ANDROID_SDK_ROOT="$ANDROIDSDK"

          export ANDROIDAPI="35"
          export ANDROIDMINAPI="24"

          export P4A_freetype_DIR="$HOME/freetype-source"

          buildozer -v android debug

      # --------------------------------------------------
      # 16. Show APK
      # --------------------------------------------------
      - name: Find APK
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      # --------------------------------------------------
      # 17. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HSE-POCKET-APK
          path: bin/*.apk
          if-no-files-found: error