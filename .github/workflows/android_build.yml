name: Build HSE Management System APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. PYTHON
      # ==========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================================
      # 3. JAVA
      # ==========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # 4. LINUX DEPENDENCIES
      # ==========================================================
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            gettext \
            autopoint


      # ==========================================================
      # 5. BUILDODOZER
      # ==========================================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer
          pip install "Cython==0.29.34"


      # ==========================================================
      # 6. SHOW VERSIONS
      # ==========================================================
      - name: Show versions
        run: |
          python --version
          buildozer --version
          java -version


      # ==========================================================
      # 7. CLEAN OLD BUILD
      # ==========================================================
      - name: Clean old Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin


      # ==========================================================
      # 8. GET FREETYPE FROM GITHUB
      #
      # IMPORTANT:
      # DO NOT USE SAVANNAH.
      #
      # Python-for-Android normally downloads FreeType from
      # download.savannah.gnu.org.
      #
      # Savannah is timing out on GitHub Actions.
      #
      # We therefore clone the official FreeType GitHub mirror
      # and tell p4a to use this local source.
      # ==========================================================
      - name: Prepare FreeType from GitHub
        run: |
          set -e

          FREETYPE_DIR="$HOME/freetype-source"

          echo "=========================================="
          echo "Preparing FreeType 2.14.1"
          echo "Source: GitHub"
          echo "=========================================="

          rm -rf "$FREETYPE_DIR"

          git clone \
            --depth 1 \
            --branch VER-2-14-1 \
            https://github.com/freetype/freetype.git \
            "$FREETYPE_DIR"

          echo "=========================================="
          echo "FreeType downloaded"
          echo "=========================================="

          test -f "$FREETYPE_DIR/CMakeLists.txt"
          test -d "$FREETYPE_DIR/src"
          test -d "$FREETYPE_DIR/include"

          echo "FreeType source:"
          ls -lah "$FREETYPE_DIR"

          echo "FreeType version:"
          grep -n "FREETYPE_MAJOR" \
            "$FREETYPE_DIR/include/freetype/freetype.h" | head -1 || true

          echo "FreeType source is ready."


      # ==========================================================
      # 9. BUILD APK
      #
      # P4A_freetype_DIR tells python-for-android:
      #
      # "Use this directory instead of downloading FreeType."
      #
      # This completely bypasses Savannah.
      # ==========================================================
      - name: Build APK
        env:
          P4A_freetype_DIR: ${{ env.HOME }}/freetype-source
        run: |
          echo "=========================================="
          echo "P4A FREETYPE SOURCE"
          echo "=========================================="

          echo "$P4A_freetype_DIR"

          test -d "$P4A_freetype_DIR"

          echo "=========================================="
          echo "BUILDING APK"
          echo "=========================================="

          buildozer -v android debug


      # ==========================================================
      # 10. FIND APK
      # ==========================================================
      - name: Search APK
        if: always()
        run: |
          echo "=========================================="
          echo "APK SEARCH"
          echo "=========================================="

          find . -type f -name "*.apk" -print

          echo "=========================================="
          echo "BIN DIRECTORY"
          echo "=========================================="

          ls -lah bin 2>/dev/null || true


      # ==========================================================
      # 11. UPLOAD APK
      # ==========================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Management-System-APK
          path: bin/*.apk
          if-no-files-found: error
