name: Build HSE-POCKET APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      # ============================================================
      # ANDROID SDK
      # ============================================================
      ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

      # ============================================================
      # ANDROID
      # ============================================================
      ANDROIDAPI: "35"
      ANDROIDMINAPI: "24"

      # ============================================================
      # NDK
      #
      # IMPORTANT:
      # All NDK variables point to the SAME NDK.
      # ============================================================
      ANDROIDNDK: /home/runner/.buildozer/android/platform/android-ndk-r28c
      ANDROID_NDK: /home/runner/.buildozer/android/platform/android-ndk-r28c
      ANDROID_NDK_ROOT: /home/runner/.buildozer/android/platform/android-ndk-r28c
      ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk-r28c

      # ============================================================
      # FREETYPE
      # ============================================================
      P4A_freetype_DIR: /home/runner/freetype-source

      # ============================================================
      # P4A PACKAGES
      # ============================================================
      PACKAGES_PATH: /home/runner/.buildozer/android/packages

      # ============================================================
      # GRADLE
      # ============================================================
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. PYTHON 3.11
      # ============================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 4. INSTALL BUILDOZER
      # ============================================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install buildozer==1.6.0

          pip install "Cython==0.29.34"

          echo "Buildozer version:"
          buildozer --version

          echo "Python version:"
          python --version


      # ============================================================
      # 5. CHECK PROJECT
      # ============================================================
      - name: Check project files
        run: |
          echo "=========================================="
          echo "PROJECT"
          echo "=========================================="

          pwd

          echo ""

          find . -maxdepth 3 -type f | sort

          echo ""

          test -f main.py
          test -f buildozer.spec
          test -f requirements.txt

          echo "Project files OK."


      # ============================================================
      # 6. PYTHON SYNTAX
      # ============================================================
      - name: Check main.py
        run: |
          python -m py_compile main.py

          echo "main.py syntax OK."


      # ============================================================
      # 7. PREPARE FREETYPE
      # ============================================================
      - name: Prepare FreeType
        run: |
          rm -rf "$HOME/freetype-source"

          git clone \
            --depth 1 \
            --branch VER-2-14-1 \
            https://github.com/freetype/freetype.git \
            "$HOME/freetype-source"

          test -f "$HOME/freetype-source/CMakeLists.txt"

          echo "FreeType ready."


      # ============================================================
      # 8. PREPARE BUILDOZER SDK
      # ============================================================
      - name: Prepare Android SDK
        run: |
          mkdir -p "$ANDROIDSDK"

          echo "System SDK:"
          ls -la /usr/local/lib/android/sdk

          echo ""

          echo "Copying system SDK..."

          cp -a /usr/local/lib/android/sdk/. "$ANDROIDSDK/"

          echo ""

          echo "Buildozer SDK:"
          ls -la "$ANDROIDSDK"


      # ============================================================
      # 9. SDKMANAGER
      # ============================================================
      - name: Prepare sdkmanager
        run: |
          mkdir -p "$ANDROIDSDK/tools/bin"

          if [ -f "$ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -sf \
              "$ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager" \
              "$ANDROIDSDK/tools/bin/sdkmanager"
          fi

          if [ ! -f "$ANDROIDSDK/tools/bin/sdkmanager" ]; then
            echo "ERROR: sdkmanager not found."

            find "$ANDROIDSDK" \
              -type f \
              -name sdkmanager \
              -print

            exit 1
          fi

          echo "sdkmanager ready."


      # ============================================================
      # 10. ACCEPT LICENSES
      # ============================================================
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$ANDROIDSDK/tools/bin/sdkmanager"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROIDSDK" \
            --licenses || true

          echo "Android licenses processed."


      # ============================================================
      # 11. INSTALL SDK COMPONENTS
      # ============================================================
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROIDSDK/tools/bin/sdkmanager"

          "$SDKMANAGER" \
            --sdk_root="$ANDROIDSDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          echo "Android SDK components ready."


      # ============================================================
      # 12. VERIFY AIDL FILE
      #
      # DO NOT EXECUTE AIDL.
      # Its --help/--version return code is not suitable
      # as a health check.
      # ============================================================
      - name: Verify Android Build Tools
        run: |
          AIDL="$ANDROIDSDK/build-tools/37.0.0/aidl"

          if [ ! -f "$AIDL" ]; then
            echo "ERROR: AIDL not found."
            exit 1
          fi

          if [ ! -x "$AIDL" ]; then
            echo "ERROR: AIDL is not executable."
            exit 1
          fi

          echo "AIDL exists:"
          ls -l "$AIDL"

          echo "Android Build Tools OK."


      # ============================================================
      # 13. CLEAN OLD BUILDOZER BUILD
      # ============================================================
      - name: Clean old Buildozer build
        run: |
          rm -rf .buildozer
          rm -rf bin

          echo "Old build removed."


      # ============================================================
      # 14. PREPARE ENVIRONMENT
      # ============================================================
      - name: Prepare final Android environment
        run: |

          # SDK
          export ANDROIDSDK="$ANDROIDSDK"
          export ANDROID_HOME="$ANDROIDSDK"
          export ANDROID_SDK_ROOT="$ANDROIDSDK"

          # NDK
          export ANDROIDNDK="$ANDROIDNDK"
          export ANDROID_NDK="$ANDROIDNDK"
          export ANDROID_NDK_ROOT="$ANDROIDNDK"
          export ANDROID_NDK_HOME="$ANDROIDNDK"

          # Android API
          export ANDROIDAPI="35"
          export ANDROIDMINAPI="24"

          # FreeType
          export P4A_freetype_DIR="$HOME/freetype-source"

          echo "=========================================="
          echo "FINAL ANDROID ENVIRONMENT"
          echo "=========================================="

          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""

          echo "ANDROIDNDK=$ANDROIDNDK"
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          echo ""

          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"

          echo ""

          echo "P4A_freetype_DIR=$P4A_freetype_DIR"


      # ============================================================
      # 15. BUILD APK
      #
      # If Buildozer fails at Gradle, DON'T immediately stop.
      # Run Gradle manually with --stacktrace so the real error
      # appears in the GitHub Actions log.
      # ============================================================
      - name: Build APK
        shell: bash
        run: |

          set +e

          export ANDROIDSDK="$ANDROIDSDK"
          export ANDROID_HOME="$ANDROIDSDK"
          export ANDROID_SDK_ROOT="$ANDROIDSDK"

          export ANDROIDNDK="$ANDROIDNDK"
          export ANDROID_NDK="$ANDROIDNDK"
          export ANDROID_NDK_ROOT="$ANDROIDNDK"
          export ANDROID_NDK_HOME="$ANDROIDNDK"

          export ANDROIDAPI="35"
          export ANDROIDMINAPI="24"

          export P4A_freetype_DIR="$HOME/freetype-source"

          echo "=========================================="
          echo "BUILDING APK"
          echo "=========================================="

          buildozer -v android debug

          BUILD_RESULT=$?

          if [ "$BUILD_RESULT" -eq 0 ]; then
            echo ""
            echo "=========================================="
            echo "BUILDOZER BUILD SUCCESSFUL"
            echo "=========================================="
            exit 0
          fi

          echo ""
          echo "=========================================="
          echo "BUILDOZER FAILED"
          echo "=========================================="

          DIST_DIR=$(find .buildozer/android/platform \
            -type f \
            -name gradlew \
            -path "*/dists/*/gradlew" \
            -print \
            -quit)

          if [ -z "$DIST_DIR" ]; then
            echo "Gradle wrapper was not found."
            echo "Buildozer failed before Gradle project creation."
            exit "$BUILD_RESULT"
          fi

          DIST_DIR=$(dirname "$DIST_DIR")

          echo ""
          echo "=========================================="
          echo "GRADLE PROJECT FOUND"
          echo "=========================================="

          echo "$DIST_DIR"

          cd "$DIST_DIR"

          chmod +x gradlew 2>/dev/null || true

          echo ""
          echo "=========================================="
          echo "ANDROID GRADLE DIAGNOSTIC"
          echo "=========================================="

          ./gradlew clean assembleDebug \
            --stacktrace \
            --info \
            --no-daemon

          GRADLE_RESULT=$?

          echo ""
          echo "=========================================="
          echo "GRADLE EXIT CODE: $GRADLE_RESULT"
          echo "=========================================="

          exit "$GRADLE_RESULT"


      # ============================================================
      # 16. FIND APK
      # ============================================================
      - name: Find APK
        if: success()
        run: |

          echo "Searching for APK..."

          find . \
            -type f \
            -name "*.apk" \
            -print

          if ! find bin \
            -type f \
            -name "*.apk" \
            -print -quit | grep -q .; then

            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found."


      # ============================================================
      # 17. UPLOAD APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HSE-POCKET-APK
          path: bin/*.apk
          if-no-files-found: error