name: Build HSE-POCKET APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

      ANDROIDAPI: "35"
      ANDROIDMINAPI: "24"

      P4A_freetype_DIR: /home/runner/freetype-source
      PACKAGES_PATH: /home/runner/.buildozer/android/packages

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. PYTHON 3.11
      # ============================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 4. INSTALL BUILD DEPENDENCIES
      # ============================================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.6.0
          pip install "Cython==0.29.34"


      # ============================================================
      # 5. CHECK PROJECT
      # ============================================================
      - name: Check project files
        run: |
          echo "Current directory:"
          pwd

          echo "Project files:"
          find . -maxdepth 3 -type f | sort

          test -f main.py
          test -f buildozer.spec
          test -f requirements.txt

          echo "Required project files found."


      # ============================================================
      # 6. CHECK MAIN.PY
      # ============================================================
      - name: Check main.py syntax
        run: |
          python -m py_compile main.py
          echo "main.py syntax OK."


      # ============================================================
      # 7. PREPARE FREETYPE
      # ============================================================
      - name: Prepare FreeType
        run: |
          rm -rf "$HOME/freetype-source"

          git clone \
            --depth 1 \
            --branch VER-2-14-1 \
            https://github.com/freetype/freetype.git \
            "$HOME/freetype-source"

          test -f "$HOME/freetype-source/CMakeLists.txt"

          echo "FreeType source ready."


      # ============================================================
      # 8. PREPARE BUILDOZER SDK
      # ============================================================
      - name: Prepare Android SDK
        run: |
          mkdir -p "$ANDROIDSDK"

          echo "System Android SDK:"
          ls -la /usr/local/lib/android/sdk

          echo "Copying Android SDK..."

          cp -a /usr/local/lib/android/sdk/. "$ANDROIDSDK/"

          echo "Buildozer Android SDK:"
          ls -la "$ANDROIDSDK"


      # ============================================================
      # 9. PREPARE SDKMANAGER
      # ============================================================
      - name: Prepare sdkmanager
        run: |
          mkdir -p "$ANDROIDSDK/tools/bin"

          if [ -f "$ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -sf \
              "$ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager" \
              "$ANDROIDSDK/tools/bin/sdkmanager"
          fi

          if [ ! -f "$ANDROIDSDK/tools/bin/sdkmanager" ]; then
            echo "ERROR: sdkmanager not found."

            find "$ANDROIDSDK" \
              -type f \
              -name sdkmanager \
              -print

            exit 1
          fi

          echo "sdkmanager ready."


      # ============================================================
      # 10. ACCEPT SDK LICENSES
      # ============================================================
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$ANDROIDSDK/tools/bin/sdkmanager"

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROIDSDK" \
            --licenses || true

          echo "License acceptance completed."


      # ============================================================
      # 11. INSTALL REQUIRED SDK COMPONENTS
      # ============================================================
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROIDSDK/tools/bin/sdkmanager"

          echo "Installing Android SDK components..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROIDSDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          echo "Android SDK components installed."


      # ============================================================
      # 12. VERIFY AIDL FILE ONLY
      #
      # IMPORTANT:
      # Do NOT run aidl --help.
      # Do NOT run aidl --version.
      # Both can return exit code 1 even though AIDL is present.
      # ============================================================
      - name: Verify AIDL
        run: |
          AIDL="$ANDROIDSDK/build-tools/37.0.0/aidl"

          echo "Checking AIDL:"
          echo "$AIDL"

          if [ ! -f "$AIDL" ]; then
            echo "ERROR: AIDL file does not exist."
            exit 1
          fi

          if [ ! -x "$AIDL" ]; then
            echo "ERROR: AIDL is not executable."
            exit 1
          fi

          echo "AIDL exists and is executable."
          ls -l "$AIDL"


      # ============================================================
      # 13. VERIFY BUILD TOOLS DIRECTORY
      # ============================================================
      - name: Verify Build Tools
        run: |
          BUILD_TOOLS="$ANDROIDSDK/build-tools/37.0.0"

          if [ ! -d "$BUILD_TOOLS" ]; then
            echo "ERROR: Build Tools directory does not exist."
            exit 1
          fi

          echo "Build Tools:"
          ls -la "$BUILD_TOOLS"

          echo "Android SDK preparation PASSED."


      # ============================================================
      # 14. SHOW FINAL ENVIRONMENT
      # ============================================================
      - name: Show Android environment
        run: |
          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"
          echo "P4A_freetype_DIR=$P4A_freetype_DIR"

          echo ""
          echo "AIDL:"
          ls -l "$ANDROIDSDK/build-tools/37.0.0/aidl"


      # ============================================================
      # 15. CLEAN BUILDOZER PROJECT BUILD FILES
      # ============================================================
      - name: Clean Buildozer project
        run: |
          rm -rf .buildozer
          rm -rf bin

          echo "Buildozer project build files cleaned."


      # ============================================================
      # 16. RECREATE SDK AFTER CLEAN
      # ============================================================
      - name: Restore Android SDK after clean
        run: |
          mkdir -p "$ANDROIDSDK"

          cp -a /usr/local/lib/android/sdk/. "$ANDROIDSDK/"

          mkdir -p "$ANDROIDSDK/tools/bin"

          if [ -f "$ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -sf \
              "$ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager" \
              "$ANDROIDSDK/tools/bin/sdkmanager"
          fi

          test -f "$ANDROIDSDK/tools/bin/sdkmanager"

          echo "SDK restored."


      # ============================================================
      # 17. BUILD APK
      # ============================================================
      - name: Build APK
        run: |
          export ANDROIDSDK="$ANDROIDSDK"
          export ANDROID_HOME="$ANDROIDSDK"
          export ANDROID_SDK_ROOT="$ANDROIDSDK"

          export ANDROIDAPI="35"
          export ANDROIDMINAPI="24"

          export P4A_freetype_DIR="$HOME/freetype-source"

          echo "=========================================="
          echo "STARTING BUILDOZER APK BUILD"
          echo "=========================================="

          buildozer -v android debug


      # ============================================================
      # 18. FIND APK
      # ============================================================
      - name: Find APK
        run: |
          echo "Searching for APK..."

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find bin -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK generated."
            exit 1
          fi

          echo "APK generated successfully."


      # ============================================================
      # 19. UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HSE-POCKET-APK
          path: bin/*.apk
          if-no-files-found: error