name: Build HSE Management APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      ANDROIDSDK: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      ANDROIDAPI: "35"
      ANDROIDMINAPI: "24"

      P4A_freetype_DIR: /home/runner/freetype-source
      PACKAGES_PATH: /home/runner/.buildozer/android/packages

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. PYTHON
      # =========================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =========================================================
      # 3. JAVA
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 4. SYSTEM DEPENDENCIES
      # =========================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            wget \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            gettext \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            ninja-build \
            ccache


      # =========================================================
      # 5. INSTALL BUILDOZER
      # =========================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.34


      # =========================================================
      # 6. VERIFY THE SYSTEM SDK
      # =========================================================

      - name: Verify Android SDK
        run: |
          echo "=============================================="
          echo "ANDROID SDK"
          echo "=============================================="

          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROIDSDK" ]; then
            echo "ERROR: Android SDK does not exist."
            exit 1
          fi

          echo ""
          echo "Build Tools:"
          ls -la "$ANDROIDSDK/build-tools"

          echo ""
          echo "Available AIDL:"
          find "$ANDROIDSDK/build-tools" \
            -name aidl \
            -type f \
            -print

          echo ""
          echo "Platform Tools:"
          ls -la "$ANDROIDSDK/platform-tools"


      # =========================================================
      # 7. ACCEPT LICENSES FOR THE ACTUAL SDK
      # =========================================================

      - name: Accept Android SDK licenses
        run: |
          echo "=============================================="
          echo "ACCEPTING ANDROID LICENSES"
          echo "=============================================="

          SDKMANAGER="$ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROIDSDK/cmdline-tools" \
              -name sdkmanager \
              -type f \
              | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses

          echo ""
          echo "Android licenses accepted."


      # =========================================================
      # 8. VERIFY REQUIRED SDK PACKAGES
      # =========================================================

      - name: Verify required Android packages
        run: |
          echo "=============================================="
          echo "VERIFYING ANDROID PACKAGES"
          echo "=============================================="

          if [ ! -d "$ANDROIDSDK/platforms/android-35" ]; then
            echo "ERROR: Android 35 platform missing."
            exit 1
          fi

          if [ ! -d "$ANDROIDSDK/build-tools/37.0.0" ]; then
            echo "ERROR: Build Tools 37.0.0 missing."
            exit 1
          fi

          if [ ! -f "$ANDROIDSDK/build-tools/37.0.0/aidl" ]; then
            echo "ERROR: AIDL missing."
            exit 1
          fi

          if [ ! -f "$ANDROIDSDK/platform-tools/adb" ]; then
            echo "ERROR: ADB missing."
            exit 1
          fi

          echo ""
          echo "Android 35: OK"
          echo "Build Tools 37.0.0: OK"
          echo "AIDL: OK"
          echo "ADB: OK"


      # =========================================================
      # 9. PROJECT CHECK
      # =========================================================

      - name: Verify project files
        run: |
          echo "=============================================="
          echo "PROJECT"
          echo "=============================================="

          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "requirements.txt:"
          cat requirements.txt

          echo ""
          echo "buildozer.spec:"
          cat buildozer.spec

          test -f main.py
          test -f requirements.txt
          test -f buildozer.spec

          echo ""
          echo "Project files OK."


      # =========================================================
      # 10. PYTHON SYNTAX
      # =========================================================

      - name: Check Python syntax
        run: |
          python -m py_compile main.py

          echo "main.py syntax OK."


      # =========================================================
      # 11. REQUIREMENTS CHECK
      # =========================================================

      - name: Check Android requirements
        run: |
          echo "=============================================="
          echo "DEPENDENCY CHECK"
          echo "=============================================="

          if grep -Eiq \
            'openpyxl|reportlab|python-docx|docx' \
            requirements.txt; then

            echo "ERROR: Removed package found."
            cat requirements.txt
            exit 1
          fi

          if grep -Eiq \
            'requests|charset-normalizer|charset_normalizer|certifi|urllib3|idna' \
            requirements.txt; then

            echo "ERROR: Unwanted network dependency found."
            cat requirements.txt
            exit 1
          fi

          echo "Dependency check OK."


      # =========================================================
      # 12. FREETYPE
      # =========================================================

      - name: Prepare FreeType
        run: |
          echo "=============================================="
          echo "FREETYPE"
          echo "=============================================="

          rm -rf "$HOME/freetype-source"

          git clone \
            --depth 1 \
            --branch VER-2-14-1 \
            https://github.com/freetype/freetype.git \
            "$HOME/freetype-source"

          if [ ! -f "$HOME/freetype-source/CMakeLists.txt" ]; then
            echo "ERROR: FreeType source was not downloaded."
            exit 1
          fi

          echo "FreeType source ready."


      # =========================================================
      # 13. EXPORT FREETYPE
      # =========================================================

      - name: Configure FreeType
        run: |
          echo "P4A_freetype_DIR=$HOME/freetype-source" >> "$GITHUB_ENV"

          export P4A_freetype_DIR="$HOME/freetype-source"

          echo "P4A_freetype_DIR=$P4A_freetype_DIR"


      # =========================================================
      # 14. REMOVE OLD BUILDOZER SDK
      #
      # IMPORTANT:
      # We do NOT want p4a/buildozer to accidentally use
      # ~/.buildozer/android/platform/android-sdk.
      # =========================================================

      - name: Remove old private Android SDK
        run: |
          echo "=============================================="
          echo "CLEANING OLD PRIVATE SDK"
          echo "=============================================="

          rm -rf "$HOME/.buildozer/android/platform/android-sdk"

          echo "Old private Buildozer SDK removed."


      # =========================================================
      # 15. CLEAN OLD PYTHON INSTALL
      # =========================================================

      - name: Clean old Android Python build
        run: |
          rm -rf .buildozer/android/platform/build-arm64-v8a/build/python-installs

          rm -rf .buildozer/android/platform/build-arm64-v8a/dists

          echo "Old Android Python installation cache removed."


      # =========================================================
      # 16. FINAL ENVIRONMENT CHECK
      # =========================================================

      - name: Final environment check
        run: |
          echo "=============================================="
          echo "FINAL BUILD ENVIRONMENT"
          echo "=============================================="

          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "ANDROIDSDK:"
          echo "$ANDROIDSDK"

          echo ""
          echo "ANDROIDAPI:"
          echo "$ANDROIDAPI"

          echo ""
          echo "ANDROIDMINAPI:"
          echo "$ANDROIDMINAPI"

          echo ""
          echo "P4A_freetype_DIR:"
          echo "$P4A_freetype_DIR"

          echo ""
          echo "AIDL:"
          "$ANDROIDSDK/build-tools/37.0.0/aidl" --version || true


      # =========================================================
      # 17. BUILD APK
      # =========================================================

      - name: Build APK
        run: |
          echo "=============================================="
          echo "STARTING HSE MANAGEMENT APK BUILD"
          echo "=============================================="

          export ANDROIDSDK="/usr/local/lib/android/sdk"
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"

          export ANDROIDAPI="35"
          export ANDROIDMINAPI="24"

          export P4A_freetype_DIR="$HOME/freetype-source"

          echo ""
          echo "SDK USED BY BUILD:"
          echo "$ANDROIDSDK"

          echo ""
          echo "Starting Buildozer..."

          buildozer -v android debug


      # =========================================================
      # 18. FIND APK
      # =========================================================

      - name: Find generated APK
        if: success()
        run: |
          echo "=============================================="
          echo "GENERATED APK"
          echo "=============================================="

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          ls -lh bin/*.apk


      # =========================================================
      # 19. UPLOAD APK
      # =========================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Management-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 20. UPLOAD LOGS ON FAILURE
      # =========================================================

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Build-Logs
          path: |
            .buildozer/android/platform/build-arm64-v8a/**/*.log
            .buildozer/android/platform/build-arm64-v8a/**/config.log
          if-no-files-found: ignore
          retention-days: 7