name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            ant \
            autoconf \
            automake \
            autopoint \
            build-essential \
            cmake \
            gettext \
            libffi-dev \
            libjpeg-dev \
            libpng-dev \
            libssl-dev \
            libtool \
            liblzma-dev \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libfreetype6-dev \
            pkg-config \
            zlib1g-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer==1.6.0 \
            "Cython==0.29.34"

      - name: Prepare FreeType
        run: |
          rm -rf "$HOME/freetype-source"

          git clone \
            --depth 1 \
            --branch VER-2-14-1 \
            https://github.com/freetype/freetype.git \
            "$HOME/freetype-source"

          test -f "$HOME/freetype-source/CMakeLists.txt"

          echo "FreeType source prepared:"
          echo "$HOME/freetype-source"

      - name: Verify Android requirements
        run: |
          echo "===== buildozer.spec ====="
          cat buildozer.spec

          echo
          echo "===== requirements.txt ====="
          cat requirements.txt

          echo
          echo "===== Checking unwanted packages ====="

          if grep -Eiq 'openpyxl|charset[-_]normalizer|reportlab|python-docx|docx' buildozer.spec requirements.txt; then
            echo "ERROR: Android build still contains an unwanted dependency."
            echo
            grep -Ein 'openpyxl|charset[-_]normalizer|reportlab|python-docx|docx' \
              buildozer.spec requirements.txt || true
            exit 1
          fi

          echo "OK: No openpyxl."
          echo "OK: No charset-normalizer."
          echo "OK: No ReportLab."
          echo "OK: No python-docx."

      - name: Check main.py imports
        run: |
          echo "===== Checking main.py ====="

          if grep -Eiq 'import openpyxl|from openpyxl|import reportlab|from reportlab|import docx|from docx' main.py; then
            echo "ERROR: main.py still contains an Android-incompatible dependency."
            grep -Ein 'openpyxl|reportlab|docx' main.py || true
            exit 1
          fi

          echo "OK: main.py contains no openpyxl/reportlab/python-docx imports."

      - name: Check Python syntax
        run: |
          python -m py_compile main.py

          echo "Python syntax check passed."

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      - name: Build APK
        run: |
          export P4A_freetype_DIR="$HOME/freetype-source"

          echo "======================================"
          echo "FreeType source:"
          echo "$P4A_freetype_DIR"
          echo "======================================"

          test -d "$P4A_freetype_DIR"

          buildozer -v android debug

      - name: Show APK
        if: always()
        run: |
          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          find . -type f -name "*.apk" -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Management-APK
          path: bin/*.apk
          if-no-files-found: error
