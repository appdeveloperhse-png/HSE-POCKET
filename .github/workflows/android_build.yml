
      - name: Install Qt wheel download tool
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade qtpip
          python -m pip show qtpip
          command -v qtpip
          qtpip --help

      - name: Download Android PySide6 wheels
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$RUNNER_TEMP/android-wheels"
          cd "$RUNNER_TEMP/android-wheels"

          qtpip download PySide6 --android --arch aarch64

          echo "Downloaded wheels:"
          find . -maxdepth 1 -type f -name '*.whl' -print

          python - <<'PY'
          from pathlib import Path
          import os
          import sys

          wheels = list(Path(".").glob("*.whl"))

          def matches(package):
              return [
                  str(p.resolve())
                  for p in wheels
                  if p.name.lower().startswith(package.lower() + "-")
                  and "android" in p.name.lower()
                  and "aarch64" in p.name.lower()
              ]

          pyside = matches("pyside6")
          shiboken = matches("shiboken6")

          if not pyside or not shiboken:
              print("ERROR: Required Android wheels were not found.")
              for wheel in wheels:
                  print(wheel.name)
              sys.exit(1)

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"PYSIDE_WHEEL={pyside[0]}\n")
              env.write(f"SHIBOKEN_WHEEL={shiboken[0]}\n")

          print("Android wheel selection passed.")
          PY
