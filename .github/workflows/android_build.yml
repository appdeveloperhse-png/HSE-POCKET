name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            ant \
            autoconf \
            automake \
            autopoint \
            build-essential \
            cmake \
            gettext \
            libffi-dev \
            libjpeg-dev \
            libpng-dev \
            libssl-dev \
            libtool \
            liblzma-dev \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libfreetype6-dev \
            pkg-config \
            zlib1g-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer==1.6.0 \
            "Cython==0.29.34"

      - name: Check Python syntax
        run: |
          python -m py_compile main.py

      - name: Verify Android requirements
        run: |
          echo "========================================"
          echo "BUILD REQUIREMENTS"
          echo "========================================"

          grep "^requirements" buildozer.spec

          echo
          echo "========================================"
          echo "requirements.txt"
          echo "========================================"

          cat requirements.txt

          echo
          echo "========================================"
          echo "Checking forbidden packages"
          echo "========================================"

          if grep -Eiq 'openpyxl|reportlab|python-docx' buildozer.spec requirements.txt; then
            echo "ERROR: Android-incompatible package found."
            exit 1
          fi

          echo "OK"

      - name: Prepare FreeType
        run: |
          rm -rf "$HOME/freetype-source"

          git clone \
            --depth 1 \
            --branch VER-2-14-1 \
            https://github.com/freetype/freetype.git \
            "$HOME/freetype-source"

          test -f "$HOME/freetype-source/CMakeLists.txt"

      - name: Clean previous Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

      - name: Build APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |

          export P4A_freetype_DIR="$HOME/freetype-source"

          echo "========================================"
          echo "FreeType"
          echo "========================================"

          echo "$P4A_freetype_DIR"

          test -d "$P4A_freetype_DIR"

          echo
          echo "========================================"
          echo "Starting Buildozer"
          echo "========================================"

          buildozer -v android debug

      - name: Show APK
        if: always()
        run: |

          echo "========================================"
          echo "APK FILES"
          echo "========================================"

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Management-APK
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error