name: Build HSE Management System APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

      # Force Python networking to IPv4
      PYTHONPATH: ${{ github.workspace }}/ci

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Python
      # ---------------------------------------------------------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------------------------
      # 3. Java
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 4. Install Linux dependencies
      # ---------------------------------------------------------
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            gettext \
            autopoint \
            curl

      # ---------------------------------------------------------
      # 5. Check network using IPv4
      # ---------------------------------------------------------
      - name: Test IPv4 network
        run: |
          echo "Testing GitHub IPv4..."
          curl -4 -I --connect-timeout 20 --retry 3 https://github.com

          echo "Testing PyPI IPv4..."
          curl -4 -I --connect-timeout 20 --retry 3 https://pypi.org

          echo "Testing Google download server IPv4..."
          curl -4 -I --connect-timeout 20 --retry 3 https://dl.google.com

      # ---------------------------------------------------------
      # 6. Install Buildozer
      # ---------------------------------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install --upgrade buildozer

          pip install "Cython==0.29.34"

      # ---------------------------------------------------------
      # 7. Show versions
      # ---------------------------------------------------------
      - name: Show build versions
        run: |
          echo "Python:"
          python --version

          echo "Buildozer:"
          buildozer --version

          echo "Java:"
          java -version

      # ---------------------------------------------------------
      # 8. Clean old Buildozer data
      # ---------------------------------------------------------
      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin

      # ---------------------------------------------------------
      # 9. Build APK
      # ---------------------------------------------------------
      - name: Build APK
        run: |
          buildozer -v android debug

      # ---------------------------------------------------------
      # 10. Find APK
      # ---------------------------------------------------------
      - name: Find APK
        if: always()
        run: |
          echo "===================================="
          echo "APK SEARCH"
          echo "===================================="

          find . -type f -name "*.apk" -print

          echo "===================================="
          echo "BIN DIRECTORY"
          echo "===================================="

          ls -lah bin 2>/dev/null || true

      # ---------------------------------------------------------
      # 11. Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Management-System-APK
          path: bin/*.apk
          if-no-files-found: error