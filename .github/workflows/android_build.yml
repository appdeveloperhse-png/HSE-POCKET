name: HSE-POCKET Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive

      # Java
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.20-1/x64

      # Buildozer / Android
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

      # Keep the API compatible with the pinned p4a release
      ANDROIDAPI: "34"
      ANDROIDMINAPI: "24"

      # FreeType workaround
      P4A_freetype_DIR: /home/runner/freetype-source

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout HSE-POCKET
        uses: actions/checkout@v4

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. JAVA
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 4. UBUNTU PACKAGES
      # ============================================================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libsqlite3-dev \
            liblzma-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libreadline-dev \
            libbz2-dev \
            libgdbm-dev \
            libgdbm-compat-dev \
            libdb-dev \
            libexpat1-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev

      # ============================================================
      # 5. PYTHON BUILD TOOLS
      # ============================================================
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "buildozer==1.6.0" \
            "cython==0.29.34"

      # ============================================================
      # 6. VERIFY APPLICATION SOURCE
      # ============================================================
      - name: Check main.py syntax
        run: |
          python -m py_compile main.py

          echo "main.py syntax check passed."

      # ============================================================
      # 7. PREPARE FREETYPE SOURCE
      # ============================================================
      - name: Prepare FreeType source
        run: |
          rm -rf "$HOME/freetype-source"

          git clone \
            --depth 1 \
            --branch VER-2-14-1 \
            https://github.com/freetype/freetype.git \
            "$HOME/freetype-source"

          test -f "$HOME/freetype-source/CMakeLists.txt"

          echo "FreeType source:"
          ls -la "$HOME/freetype-source"

      # ============================================================
      # 8. PREPARE ANDROID SDK
      # ============================================================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK"

          echo "System Android SDK locations:"
          echo "--------------------------------"

          if [ -d "/usr/local/lib/android/sdk" ]; then
            find /usr/local/lib/android/sdk \
              -maxdepth 2 \
              -type d \
              | head -100 || true
          fi

          echo "--------------------------------"

          # --------------------------------------------------------
          # Copy the GitHub runner SDK into Buildozer's SDK location.
          # Do NOT copy the NDK. p4a will install the correct NDK r25b.
          # --------------------------------------------------------
          if [ -d "/usr/local/lib/android/sdk" ]; then

            rsync -a \
              --exclude='ndk' \
              --exclude='ndk-bundle' \
              /usr/local/lib/android/sdk/ \
              "$SDK/"

          else
            echo "ERROR: System Android SDK was not found."
            exit 1
          fi

          # --------------------------------------------------------
          # Modern Android SDK has:
          #
          # cmdline-tools/latest/bin/sdkmanager
          #
          # Old p4a 2024.01.21 expects:
          #
          # tools/bin/sdkmanager
          #
          # Create the compatibility path.
          # --------------------------------------------------------

          mkdir -p "$SDK/tools/bin"

          SYSTEM_SDKMANAGER=""

          if [ -x "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            SYSTEM_SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"

          elif [ -x "/usr/local/lib/android/sdk/cmdline-tools/bin/sdkmanager" ]; then
            SYSTEM_SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/bin/sdkmanager"

          elif [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SYSTEM_SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          else
            SYSTEM_SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools \
              -type f \
              -name sdkmanager \
              -executable \
              2>/dev/null \
              | head -1 || true)"
          fi

          if [ -z "$SYSTEM_SDKMANAGER" ]; then
            echo "ERROR: Modern sdkmanager could not be found."
            echo
            echo "Searching runner:"
            find /usr/local/lib/android/sdk \
              -type f \
              -name sdkmanager \
              2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SYSTEM_SDKMANAGER"

          # --------------------------------------------------------
          # Create the legacy path expected by p4a.
          # --------------------------------------------------------
          ln -sfn \
            "$SYSTEM_SDKMANAGER" \
            "$SDK/tools/bin/sdkmanager"

          # --------------------------------------------------------
          # Also expose modern cmdline-tools inside the private SDK.
          # --------------------------------------------------------
          if [ -d "/usr/local/lib/android/sdk/cmdline-tools" ]; then
            rm -rf "$SDK/cmdline-tools"
            cp -a \
              "/usr/local/lib/android/sdk/cmdline-tools" \
              "$SDK/cmdline-tools"
          fi

          # Re-create legacy link after copying cmdline-tools.
          mkdir -p "$SDK/tools/bin"

          SYSTEM_SDKMANAGER_PRIVATE=""

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SYSTEM_SDKMANAGER_PRIVATE="$SDK/cmdline-tools/latest/bin/sdkmanager"

          else
            SYSTEM_SDKMANAGER_PRIVATE="$(find "$SDK/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -executable \
              2>/dev/null \
              | head -1 || true)"
          fi

          if [ -z "$SYSTEM_SDKMANAGER_PRIVATE" ]; then
            echo "ERROR: sdkmanager was not copied into private SDK."
            exit 1
          fi

          ln -sfn \
            "$SYSTEM_SDKMANAGER_PRIVATE" \
            "$SDK/tools/bin/sdkmanager"

          # --------------------------------------------------------
          # Verify exactly the path p4a expects.
          # Do NOT run sdkmanager --version here.
          # --------------------------------------------------------
          echo
          echo "Legacy sdkmanager path:"
          ls -l "$SDK/tools/bin/sdkmanager"

          test -e "$SDK/tools/bin/sdkmanager"
          test -x "$SDK/tools/bin/sdkmanager"

          echo
          echo "SDK manager compatibility path is READY."

      # ============================================================
      # 9. ACCEPT ANDROID LICENSES
      # ============================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          SDKMANAGER="$SDK/tools/bin/sdkmanager"

          test -e "$SDKMANAGER"
          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Android licenses processed."

      # ============================================================
      # 10. INSTALL API 34 + BUILD TOOLS
      # ============================================================
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          SDKMANAGER="$SDK/tools/bin/sdkmanager"

          test -e "$SDKMANAGER"
          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            >/dev/null

          echo
          echo "Installed Android platforms:"
          find "$SDK/platforms" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            2>/dev/null || true

          echo
          echo "Installed Build Tools:"
          find "$SDK/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            2>/dev/null || true

      # ============================================================
      # 11. REMOVE OLD BUILD STATE
      # ============================================================
      - name: Clean old Buildozer state
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "Clean build directory prepared."

      # ============================================================
      # 12. DISPLAY TOOLCHAIN
      # ============================================================
      - name: Verify complete Android toolchain
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          echo "======================================"
          echo "HSE-POCKET ANDROID BUILD"
          echo "======================================"

          echo
          echo "Python:"
          python --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Cython:"
          cython --version

          echo
          echo "SDK:"
          echo "$SDK"

          echo
          echo "Legacy sdkmanager:"
          ls -l "$SDK/tools/bin/sdkmanager"

          echo
          echo "Platform:"
          test -d "$SDK/platforms/android-34"
          echo "android-34 OK"

          echo
          echo "Build Tools:"
          test -d "$SDK/build-tools/34.0.0"
          echo "build-tools 34.0.0 OK"

          echo
          echo "FreeType:"
          test -f "$HOME/freetype-source/CMakeLists.txt"
          echo "FreeType source OK"

          echo
          echo "======================================"
          echo "TOOLCHAIN PREFLIGHT PASSED"
          echo "======================================"

      # ============================================================
      # 13. BUILD APK
      # ============================================================
      - name: Build HSE-POCKET APK
        shell: bash
        env:
          P4A_freetype_DIR: /home/runner/freetype-source
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROIDSDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROIDAPI="34"
          export ANDROIDMINAPI="24"

          export P4A_freetype_DIR="$HOME/freetype-source"

          echo
          echo "======================================"
          echo "STARTING BUILDOZER"
          echo "======================================"

          buildozer -v android debug

      # ============================================================
      # 14. FIND APK
      # ============================================================
      - name: Locate APK
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          echo "APK files found:"

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find . \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          mkdir -p bin

          find .buildozer \
            -type f \
            -name "*.apk" \
            -exec cp {} bin/ \;

          echo
          echo "Final APK:"
          ls -lh bin/*.apk

      # ============================================================
      # 15. UPLOAD APK
      # ============================================================
      - name: Upload HSE-POCKET APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HSE-POCKET-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 16. FAILURE DIAGNOSTICS
      # ============================================================
      - name: Collect build diagnostics
        if: failure()
        shell: bash
        run: |
          echo
          echo "======================================"
          echo "BUILD FAILED - DIAGNOSTICS"
          echo "======================================"

          echo
          echo "Python:"
          python --version || true

          echo
          echo "Buildozer:"
          buildozer --version || true

          echo
          echo "SDK:"
          ls -la "$HOME/.buildozer/android/platform/" 2>/dev/null || true

          echo
          echo "SDK manager:"
          ls -la \
            "$HOME/.buildozer/android/platform/android-sdk/tools/bin/" \
            2>/dev/null || true

          echo
          echo "Android platforms:"
          find \
            "$HOME/.buildozer/android/platform/android-sdk/platforms" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            2>/dev/null || true

          echo
          echo "Build tools:"
          find \
            "$HOME/.buildozer/android/platform/android-sdk/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            2>/dev/null || true

          echo
          echo "NDKs:"
          find \
            "$HOME/.buildozer/android/platform" \
            -maxdepth 1 \
            -type d \
            -name "android-ndk-*" \
            2>/dev/null || true

          echo
          echo "APK files:"
          find . \
            -type f \
            -name "*.apk" \
            -print \
            2>/dev/null || true

          echo
          echo "======================================"
          echo "END DIAGNOSTICS"
          echo "======================================"