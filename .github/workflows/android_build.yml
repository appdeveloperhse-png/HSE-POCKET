
      - name: Install Qt for Python deployment tools
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install "PySide6==${PYSIDE_VERSION}"

          python -m pip install \
            -r "$(python -c 'import pathlib, PySide6; print(pathlib.Path(PySide6.__file__).parent / "scripts" / "requirements-android.txt")')"

          python -m pip install "buildozer==1.6.0" "Cython==0.29.34"

          python -c "import PySide6, jinja2, pkginfo, tqdm; print('PySide6:', PySide6.__version__); print('Android deployment dependencies OK')"

          pyside6-android-deploy --help
