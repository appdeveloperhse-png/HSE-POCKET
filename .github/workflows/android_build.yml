
name: Build HSE Management System APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "main.py"
      - "buildozer.spec"
      - "requirements.txt"
      - ".github/workflows/android_build.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool \
            pkg-config cmake \
            build-essential \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            libltdl-dev

      - name: Install Buildozer
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            "buildozer==1.5.0" \
            "Cython==0.29.34"

      - name: Validate project files
        shell: bash
        run: |
          set -euxo pipefail

          test -f main.py
          test -f buildozer.spec

          python -m py_compile main.py

          grep -q "requirements = python3,kivy" buildozer.spec

          if grep -q "PySide6\|PyQt6" main.py; then
            echo "ERROR: Qt imports remain in main.py."
            echo "Use the Kivy replacement main.py provided for this workflow."
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          set -euxo pipefail
          buildozer android debug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p apk-output
          find bin -maxdepth 1 -type f -name "*.apk" -exec cp {} apk-output/ \;

          if ! find apk-output -maxdepth 1 -type f -name "*.apk" | grep -q .; then
            echo "ERROR: Build completed without producing an APK."
            echo "Contents of bin directory:"
            find bin -maxdepth 2 -type f -print || true
            exit 1
          fi

          ls -lh apk-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Management-System-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Android-Build-Logs
          path: |
            .buildozer/android/platform/build-*/dists/**/build.log
            .buildozer/android/platform/build-*/**/*.log
          if-no-files-found: ignore
          retention-days: 7
