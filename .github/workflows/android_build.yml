name: Build HSE-POCKET APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build HSE-POCKET APK
    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.20-1/x64

      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
      ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk

      ANDROIDAPI: "35"
      ANDROIDMINAPI: "24"

      P4A_freetype_DIR: /home/runner/freetype-source

      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # SYSTEM PACKAGES
      # ============================================================

      - name: Install system packages
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            curl \
            wget \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake


      # ============================================================
      # PYTHON BUILD TOOLS
      # ============================================================

      - name: Install Buildozer
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "buildozer==1.6.0" \
            "cython==0.29.34"


      # ============================================================
      # VERIFY APP BEFORE EXPENSIVE BUILD
      # ============================================================

      - name: Validate application
        run: |
          set -euxo pipefail

          echo "Checking main.py..."

          test -f main.py

          python -m py_compile main.py

          echo "main.py syntax: OK"

          test -f buildozer.spec

          echo
          echo "Requirements:"
          if [ -f requirements.txt ]; then
            cat requirements.txt
          fi

          echo
          echo "Buildozer specification:"
          cat buildozer.spec


      # ============================================================
      # FREE TYPE
      # ============================================================

      - name: Prepare FreeType
        run: |
          set -euxo pipefail

          rm -rf "$HOME/freetype-source"

          git clone \
            --depth 1 \
            --branch VER-2-14-1 \
            https://github.com/freetype/freetype.git \
            "$HOME/freetype-source"

          test -f \
            "$HOME/freetype-source/include/freetype/freetype.h"

          echo "FreeType source ready."


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Prepare Android SDK
        run: |
          set -euxo pipefail

          SYSTEM_SDK="/usr/local/lib/android/sdk"
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          rm -rf "$SDK"

          mkdir -p "$SDK"

          cp -a "$SYSTEM_SDK/." "$SDK/"

          test -d "$SDK/platforms/android-35"

          echo
          echo "Android SDK prepared:"
          echo "$SDK"

          echo
          echo "Available Build Tools:"
          find "$SDK/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            | sort || true


      # ============================================================
      # VERIFY AIDL
      # ============================================================

      - name: Verify AIDL
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          AIDL=""

          for version in \
            37.0.0 \
            36.0.0 \
            35.0.0 \
            34.0.0 \
            33.0.2
          do
            if [ -x "$SDK/build-tools/$version/aidl" ]; then
              AIDL="$SDK/build-tools/$version/aidl"
              break
            fi
          done

          if [ -z "$AIDL" ]; then
            echo "ERROR: No usable AIDL found."

            find "$SDK/build-tools" \
              -type f \
              -name aidl \
              -print || true

            exit 1
          fi

          echo "AIDL found:"
          ls -l "$AIDL"


      # ============================================================
      # ACCEPT SDK LICENSES
      # ============================================================

      - name: Accept Android licenses
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
              --sdk_root="$SDK" \
              --licenses \
              >/dev/null || true
          fi

          echo "Android licenses processed."


      # ============================================================
      # CLEAN BUILDOZER
      # ============================================================

      - name: Clean Buildozer
        run: |
          set -euxo pipefail

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "Buildozer cache cleared."


      # ============================================================
      # VERIFY TOOLCHAIN
      # ============================================================

      - name: Verify toolchain
        run: |
          set -euxo pipefail

          echo
          echo "Python:"
          python --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "SDK:"
          echo "$ANDROIDSDK"

          echo
          echo "API:"
          echo "$ANDROIDAPI"

          echo
          echo "Minimum API:"
          echo "$ANDROIDMINAPI"


      # ============================================================
      # BUILD
      #
      # IMPORTANT:
      # buildozer.spec pins p4a to the stable 2024.01.21 release.
      #
      # We DO NOT manually copy an NDK here.
      # p4a/buildozer handles its compatible NDK.
      # ============================================================

      - name: Build APK
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROIDSDK="$ANDROID_HOME"

          export ANDROIDAPI="35"
          export ANDROIDMINAPI="24"

          export P4A_freetype_DIR="$HOME/freetype-source"

          echo
          echo "======================================"
          echo "HSE-POCKET ANDROID BUILD"
          echo "======================================"

          echo "Python:"
          python --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Android API: $ANDROIDAPI"
          echo "Minimum API: $ANDROIDMINAPI"
          echo "Architecture: arm64-v8a"
          echo "p4a: 2024.01.21"
          echo "FreeType: $P4A_freetype_DIR"

          echo
          echo "Starting Buildozer..."

          buildozer -v android debug


      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        if: success()
        run: |
          set -euxo pipefail

          echo
          echo "Searching for APK..."

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find bin -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Build completed but no APK was found."
            exit 1
          fi

          echo
          echo "======================================"
          echo "APK CREATED"
          echo "======================================"

          ls -lh "$APK"

          file "$APK"


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HSE-POCKET-APK
          path: bin/*.apk
          if-no-files-found: error


      # ============================================================
      # FAILURE INFORMATION
      # ============================================================

      - name: Failure diagnostics
        if: failure()
        run: |
          echo
          echo "======================================"
          echo "BUILD FAILED"
          echo "======================================"

          echo
          echo "p4a checkout:"
          if [ -d ".buildozer/android/platform/python-for-android" ]; then
            git -C \
              .buildozer/android/platform/python-for-android \
              rev-parse HEAD \
              || true
          fi

          echo
          echo "Gradle versions:"
          find .buildozer \
            -name gradle-wrapper.properties \
            -type f \
            -exec grep -H "distributionUrl" {} \; \
            2>/dev/null || true

          echo
          echo "NDK locations:"
          find "$HOME/.buildozer/android/platform" \
            -maxdepth 5 \
            -type f \
            -name source.properties \
            -print \
            2>/dev/null || true

          echo
          echo "Recent Gradle errors:"
          grep -RniE \
            "BUILD FAILED|ERROR:|Exception|FAILED|Could not" \
            .buildozer/android/platform/build-arm64-v8a \
            2>/dev/null \
            | tail -100 \
            || true