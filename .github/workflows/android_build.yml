name: Build HSE Management APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      P4A_freetype_DIR: /home/runner/freetype-source
      PACKAGES_PATH: /home/runner/.buildozer/android/packages

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. PYTHON
      # =========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =========================================================
      # 3. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 4. SYSTEM PACKAGES
      # =========================================================

      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            wget \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            gettext \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            ninja-build \
            ccache


      # =========================================================
      # 5. BUILD TOOLS / ANDROID SDK LICENSES
      # =========================================================

      - name: Accept Android SDK licenses and install Build Tools
        run: |
          echo "=============================================="
          echo "ANDROID SDK SETUP"
          echo "=============================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          echo "=============================================="
          echo "BUILD TOOLS INSTALLED"
          echo "=============================================="

          ls -la "$ANDROID_HOME/build-tools"

          test -d "$ANDROID_HOME/build-tools/37.0.0"

          echo "Build Tools 37.0.0 found."


      # =========================================================
      # 6. FORCE SDK LICENSE ACCEPTANCE
      # =========================================================

      - name: Accept SDK licenses again
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi

          yes | "$SDKMANAGER" --licenses

          echo "Android SDK licenses accepted."


      # =========================================================
      # 7. PYTHON BUILD TOOLS
      # =========================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.34


      # =========================================================
      # 8. VERIFY PROJECT
      # =========================================================

      - name: Verify project
        run: |
          echo "=============================================="
          echo "PROJECT"
          echo "=============================================="

          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "requirements.txt:"
          cat requirements.txt

          echo ""
          echo "buildozer.spec:"
          cat buildozer.spec

          test -f main.py
          test -f buildozer.spec
          test -f requirements.txt

          echo "Project files verified."


      # =========================================================
      # 9. PYTHON SYNTAX CHECK
      # =========================================================

      - name: Check Python syntax
        run: |
          python -m py_compile main.py

          echo "main.py syntax OK."


      # =========================================================
      # 10. VERIFY ANDROID BUILD TOOLS
      # =========================================================

      - name: Verify Android tools
        run: |
          echo "=============================================="
          echo "ANDROID TOOL CHECK"
          echo "=============================================="

          echo "SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Build Tools:"
          ls -la "$ANDROID_HOME/build-tools"

          echo ""
          echo "AIDL:"
          find "$ANDROID_HOME/build-tools" -name aidl -type f -print

          echo ""
          echo "ADB:"
          find "$ANDROID_HOME/platform-tools" -name adb -type f -print

          AIDL="$ANDROID_HOME/build-tools/37.0.0/aidl"

          if [ ! -f "$AIDL" ]; then
            echo "ERROR: AIDL was not installed."
            exit 1
          fi

          chmod +x "$AIDL"

          "$AIDL" --version || true

          echo "Android tools verified."


      # =========================================================
      # 11. PREPARE FREETYPE
      # =========================================================

      - name: Prepare FreeType
        run: |
          rm -rf "$HOME/freetype-source"

          git clone \
            --depth 1 \
            --branch VER-2-14-1 \
            https://github.com/freetype/freetype.git \
            "$HOME/freetype-source"

          test -f "$HOME/freetype-source/CMakeLists.txt"

          echo "FreeType source ready."


      # =========================================================
      # 12. SET FREETYPE ENVIRONMENT
      # =========================================================

      - name: Configure FreeType
        run: |
          echo "P4A_freetype_DIR=$HOME/freetype-source" >> "$GITHUB_ENV"

          export P4A_freetype_DIR="$HOME/freetype-source"

          echo "P4A_freetype_DIR=$P4A_freetype_DIR"

          test -d "$P4A_freetype_DIR"


      # =========================================================
      # 13. SHOW ENVIRONMENT
      # =========================================================

      - name: Show build environment
        run: |
          echo "=============================================="
          echo "BUILD ENVIRONMENT"
          echo "=============================================="

          python --version
          java -version
          buildozer --version

          echo ""
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"
          echo "P4A_freetype_DIR=$P4A_freetype_DIR"


      # =========================================================
      # 14. CLEAN OLD BUILD CACHE
      # =========================================================

      - name: Clean old Buildozer cache
        run: |
          rm -rf .buildozer/android/platform/build-arm64-v8a/build/python-installs
          rm -rf .buildozer/android/platform/build-arm64-v8a/dists

          echo "Old Android Python build cache removed."


      # =========================================================
      # 15. BUILD APK
      # =========================================================

      - name: Build APK
        run: |
          export P4A_freetype_DIR="$HOME/freetype-source"

          echo "=============================================="
          echo "STARTING BUILD"
          echo "=============================================="

          buildozer -v android debug


      # =========================================================
      # 16. SHOW APK
      # =========================================================

      - name: Show generated APK
        if: success()
        run: |
          echo "=============================================="
          echo "APK FILE"
          echo "=============================================="

          find bin -maxdepth 1 -type f -name "*.apk" -print

          ls -lh bin/*.apk


      # =========================================================
      # 17. UPLOAD APK
      # =========================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Management-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 18. SAVE LOGS IF BUILD FAILS
      # =========================================================

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Build-Logs
          path: |
            .buildozer/android/platform/build-arm64-v8a/**/*.log
            .buildozer/android/platform/build-arm64-v8a/**/config.log
          if-no-files-found: ignore
          retention-days: 7