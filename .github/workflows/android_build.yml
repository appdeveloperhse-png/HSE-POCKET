name: Build HSE-POCKET APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive

      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.20-1/x64

      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
      ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk

      ANDROIDAPI: "35"
      ANDROIDMINAPI: "24"

      # FreeType workaround
      P4A_freetype_DIR: /home/runner/freetype-source

      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m"

    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ------------------------------------------------------------
      # JAVA
      # ------------------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ------------------------------------------------------------
      # SYSTEM PACKAGES
      # ------------------------------------------------------------

      - name: Install system packages
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            curl \
            wget \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake


      # ------------------------------------------------------------
      # PYTHON BUILD TOOLS
      # ------------------------------------------------------------

      - name: Install Buildozer and build dependencies
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "buildozer==1.6.0" \
            "cython==0.29.34"


      # ------------------------------------------------------------
      # VERIFY APPLICATION FILES
      # ------------------------------------------------------------

      - name: Verify application files
        run: |
          set -euxo pipefail

          echo "Repository:"
          pwd

          echo
          echo "Files:"
          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            | sort

          echo
          echo "Checking main.py..."

          test -f main.py
          python -m py_compile main.py

          echo
          echo "main.py syntax OK"

          test -f buildozer.spec

          echo
          echo "buildozer.spec:"
          cat buildozer.spec


      # ------------------------------------------------------------
      # FREE TYPE
      # ------------------------------------------------------------

      - name: Prepare FreeType source
        run: |
          set -euxo pipefail

          rm -rf "$HOME/freetype-source"

          git clone \
            --depth 1 \
            --branch VER-2-14-1 \
            https://github.com/freetype/freetype.git \
            "$HOME/freetype-source"

          test -f "$HOME/freetype-source/include/freetype/freetype.h"

          echo
          echo "FreeType source prepared:"
          echo "$HOME/freetype-source"

          echo
          echo "FreeType version:"
          grep -m1 "FREETYPE_MAJOR" \
            "$HOME/freetype-source/include/freetype/freetype.h" || true


      # ------------------------------------------------------------
      # ANDROID SDK
      # ------------------------------------------------------------

      - name: Prepare Android SDK
        run: |
          set -euxo pipefail

          SYSTEM_SDK="/usr/local/lib/android/sdk"
          PRIVATE_SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf "$PRIVATE_SDK"

          mkdir -p "$PRIVATE_SDK"

          cp -a "$SYSTEM_SDK/." "$PRIVATE_SDK/"

          echo
          echo "Android SDK:"
          echo "$PRIVATE_SDK"

          test -d "$PRIVATE_SDK/platform-tools"
          test -d "$PRIVATE_SDK/platforms/android-35"

          echo
          echo "Installed SDK platforms:"
          find "$PRIVATE_SDK/platforms" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            | sort || true


      # ------------------------------------------------------------
      # ANDROID BUILD TOOLS
      # ------------------------------------------------------------

      - name: Verify Android Build Tools
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo
          echo "Build Tools:"
          find "$SDK/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            | sort

          test -d "$SDK/build-tools/37.0.0"

          test -x "$SDK/build-tools/37.0.0/aidl"

          echo
          echo "AIDL exists:"
          ls -l "$SDK/build-tools/37.0.0/aidl"


      # ------------------------------------------------------------
      # ANDROID NDK 25b
      # ------------------------------------------------------------

      - name: Prepare Android NDK 25b
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo
          echo "Available NDKs before cleanup:"
          find "$SDK/ndk" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            | sort || true

          # Remove all NDKs copied from the GitHub runner SDK.
          rm -rf "$SDK/ndk"

          mkdir -p "$SDK/ndk"

          # GitHub hosted runner contains Android NDK 25b.
          SYSTEM_NDK="/usr/local/lib/android/sdk/ndk/25.1.8937393"

          if [ ! -d "$SYSTEM_NDK" ]; then
            echo "ERROR: NDK 25.1.8937393 was not found."
            echo
            echo "Available system NDKs:"
            find /usr/local/lib/android/sdk/ndk \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              | sort || true
            exit 1
          fi

          cp -a \
            "$SYSTEM_NDK" \
            "$SDK/ndk/25.1.8937393"

          echo
          echo "NDK installed:"
          "$SDK/ndk/25.1.8937393/source.properties"

          echo
          echo "NDK directories:"
          find "$SDK/ndk" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            | sort


      # ------------------------------------------------------------
      # ANDROID ENVIRONMENT
      # ------------------------------------------------------------

      - name: Configure Android environment
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$SDK/ndk/25.1.8937393"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROIDSDK="$SDK"

          export ANDROID_NDK_HOME="$NDK"
          export ANDROID_NDK_ROOT="$NDK"
          export ANDROID_NDK="$NDK"
          export ANDROIDNDK="$NDK"

          export ANDROIDAPI="35"
          export ANDROIDMINAPI="24"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$ANDROIDSDK" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_NDK" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$ANDROIDNDK" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=35" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=24" >> "$GITHUB_ENV"

          echo "P4A_freetype_DIR=$HOME/freetype-source" >> "$GITHUB_ENV"

          echo
          echo "ANDROID_HOME=$SDK"
          echo "ANDROID_NDK=$NDK"

          echo
          echo "NDK release:"
          cat "$NDK/source.properties"


      # ------------------------------------------------------------
      # ACCEPT ANDROID LICENSES
      # ------------------------------------------------------------

      - name: Accept Android SDK licenses
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses \
            >/dev/null || true

          echo
          echo "Licenses accepted."


      # ------------------------------------------------------------
      # CLEAN PREVIOUS BUILDOZER STATE
      # ------------------------------------------------------------

      - name: Clean Buildozer state
        run: |
          set -euxo pipefail

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "Clean Buildozer state created."


      # ------------------------------------------------------------
      # VERIFY PINNED P4A CONFIGURATION
      # ------------------------------------------------------------

      - name: Verify Buildozer configuration
        run: |
          set -euxo pipefail

          echo
          echo "p4a settings from buildozer.spec:"
          grep -E \
            'p4a.branch|p4a.commit|android.ndk|android.api|android.minapi|android.archs|requirements' \
            buildozer.spec

          echo
          echo "Python:"
          python --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Buildozer:"
          buildozer --version


      # ------------------------------------------------------------
      # BUILD APK
      # ------------------------------------------------------------

      - name: Build APK
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROIDSDK="$ANDROID_HOME"

          export ANDROID_NDK="$ANDROID_HOME/ndk/25.1.8937393"
          export ANDROID_NDK_ROOT="$ANDROID_NDK"
          export ANDROID_NDK_HOME="$ANDROID_NDK"
          export ANDROIDNDK="$ANDROID_NDK"

          export ANDROIDAPI="35"
          export ANDROIDMINAPI="24"

          export P4A_freetype_DIR="$HOME/freetype-source"

          echo
          echo "FINAL TOOLCHAIN"
          echo "==============="
          echo "SDK  : $ANDROID_HOME"
          echo "NDK  : $ANDROID_NDK"
          echo "API  : $ANDROIDAPI"
          echo "MIN  : $ANDROIDMINAPI"
          echo "ARCH : arm64-v8a"
          echo "p4a  : 957a3e5"
          echo "P4A FreeType: $P4A_freetype_DIR"

          echo
          echo "NDK release:"
          cat "$ANDROID_NDK/source.properties"

          echo
          echo "Starting Buildozer..."

          buildozer -v android debug


      # ------------------------------------------------------------
      # FIND APK
      # ------------------------------------------------------------

      - name: Locate APK
        if: success()
        run: |
          set -euxo pipefail

          echo
          echo "APK files:"
          find . \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find bin -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo
          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # ------------------------------------------------------------
      # UPLOAD APK
      # ------------------------------------------------------------

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HSE-POCKET-debug-apk
          path: bin/*.apk
          if-no-files-found: error


      # ------------------------------------------------------------
      # FAILURE DIAGNOSTICS
      # ------------------------------------------------------------

      - name: Collect failure diagnostics
        if: failure()
        run: |
          echo
          echo "=========================================="
          echo "BUILD FAILURE DIAGNOSTICS"
          echo "=========================================="

          echo
          echo "Buildozer files:"
          find .buildozer \
            -maxdepth 4 \
            -type f \
            2>/dev/null \
            | head -300 || true

          echo
          echo "Gradle wrappers:"
          find .buildozer \
            -type f \
            -name "gradle-wrapper.properties" \
            -print \
            2>/dev/null || true

          echo
          echo "p4a version:"
          if [ -f ".buildozer/android/platform/python-for-android/pythonforandroid/__init__.py" ]; then
            grep -n "__version__" \
              .buildozer/android/platform/python-for-android/pythonforandroid/__init__.py \
              || true
          fi

          echo
          echo "p4a git commit:"
          if [ -d ".buildozer/android/platform/python-for-android/.git" ]; then
            git \
              -C .buildozer/android/platform/python-for-android \
              rev-parse HEAD \
              || true
          fi

          echo
          echo "Gradle versions found:"
          find .buildozer \
            -type f \
            -name "gradle-wrapper.properties" \
            -exec grep -H "distributionUrl" {} \; \
            2>/dev/null \
            || true

          echo
          echo "NDK versions:"
          find "$HOME/.buildozer/android/platform" \
            -maxdepth 4 \
            -type f \
            -name "source.properties" \
            -print \
            2>/dev/null \
            | sort \
            || true

          echo
          echo "SDL2 locations:"
          find .buildozer/android/platform/build-arm64-v8a \
            -maxdepth 6 \
            -iname "*SDL2*" \
            2>/dev/null \
            | head -200 \
            || true