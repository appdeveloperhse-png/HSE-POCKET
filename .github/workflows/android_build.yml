name: Build HSE Management System APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            gettext \
            autopoint

      - name: Test network
        run: |
          echo "======================================"
          echo "NETWORK TEST"
          echo "======================================"

          curl -4 -L \
            --connect-timeout 30 \
            --max-time 120 \
            --retry 5 \
            --retry-delay 5 \
            -I https://github.com

          curl -4 -L \
            --connect-timeout 30 \
            --max-time 120 \
            --retry 5 \
            --retry-delay 5 \
            -I https://pypi.org

          echo "Network test completed."

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer
          pip install "Cython==0.29.34"

      - name: Show versions
        run: |
          echo "Python:"
          python --version

          echo "Buildozer:"
          buildozer --version

          echo "Java:"
          java -version

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Search APK
        if: always()
        run: |
          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          find . -type f -name "*.apk" -print

          echo "======================================"
          echo "BIN"
          echo "======================================"

          ls -lah bin 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Management-System-APK
          path: bin/*.apk
          if-no-files-found: error
