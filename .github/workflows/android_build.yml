
name: HSE Management System Android (PySide6)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      PYSIDE_VERSION: "6.10.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up host Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl rsync \
            build-essential cmake autoconf automake libtool pkg-config \
            libffi-dev libssl-dev zlib1g-dev libsqlite3-dev liblzma-dev \
            libncurses5-dev libncursesw5-dev libreadline-dev libbz2-dev \
            libgdbm-dev libgdbm-compat-dev libdb-dev libexpat1-dev
          python -m pip install --upgrade pip setuptools wheel

      - name: Validate main.py
        shell: bash
        run: |
          set -euxo pipefail
          test -f main.py
          grep -q 'from PySide6' main.py
          grep -q 'QApplication' main.py
          python -m py_compile main.py

          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("main.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          names = {
              node.name
              for node in ast.walk(tree)
              if isinstance(
                  node,
                  (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)
              )
          }

          required = {"main", "Database", "MainWindow"}
          missing = required - names
          if missing:
              raise SystemExit(
                  f"Required application symbols missing: {sorted(missing)}"
              )

          print("Python syntax and application symbol checks passed.")
          PY

      - name: Disable legacy Kivy configuration
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f buildozer.spec ]; then
            mv buildozer.spec buildozer.spec.kivy-legacy-disabled
          fi

          if [ -f requirements.txt ]; then
            mv requirements.txt requirements-kivy-legacy.txt
          fi

          printf 'openpyxl==3.1.5\net-xmlfile>=1.1.0\n' \
            > requirements.txt

      - name: Install Qt for Python deployment tools
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install "PySide6==${PYSIDE_VERSION}"
          python -m pip install "buildozer==1.6.0" "Cython==0.29.34"

          python -c "import PySide6; print(PySide6.__version__)"
          pyside6-android-deploy --help

      - name: Download Android SDK, NDK and target Python
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 --branch 6.10 \
            https://code.qt.io/pyside/pyside-setup.git \
            "$RUNNER_TEMP/pyside-setup"

          python -m pip install \
            -r "$RUNNER_TEMP/pyside-setup/requirements.txt" \
            -r "$RUNNER_TEMP/pyside-setup/tools/cross_compile_android/requirements.txt"

          python "$RUNNER_TEMP/pyside-setup/tools/cross_compile_android/main.py" \
            --download-only \
            --skip-update \
            --auto-accept-license \
            --plat-name=aarch64

      - name: Download Android PySide6 and Shiboken wheels
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$RUNNER_TEMP/android-wheels"
          cd "$RUNNER_TEMP/android-wheels"

          qtpip download PySide6 --android --arch aarch64

          echo "Downloaded Android wheels:"
          find . -maxdepth 1 -type f -name '*.whl' -print

          PYSIDE_WHEEL="$(find . -maxdepth 1 -type f \
            -iname '*pyside6*android_aarch64.whl' -print -quit)"

          SHIBOKEN_WHEEL="$(find . -maxdepth 1 -type f \
            -iname '*shiboken6*android_aarch64.whl' -print -quit)"

          if [ -z "$PYSIDE_WHEEL" ] || [ -z "$SHIBOKEN_WHEEL" ]; then
            echo "::error::Android PySide6 or Shiboken wheel not found."
            exit 1
          fi

          echo "PYSIDE_WHEEL=$PYSIDE_WHEEL" >> "$GITHUB_ENV"
          echo "SHIBOKEN_WHEEL=$SHIBOKEN_WHEEL" >> "$GITHUB_ENV"

      - name: Build Android APK
        shell: bash
        run: |
          set -euxo pipefail

          pyside6-android-deploy \
            --name "HSE Management System" \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL" \
            --keep-deployment-files \
            --force

      - name: Validate APK and collect artifact
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p output
          mapfile -t APK_FILES < <(
            find . -type f -name '*.apk' \
              -not -path './.git/*' \
              -not -path './output/*' -print
          )

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "::error::No APK was produced."
            exit 1
          fi

          for apk in "${APK_FILES[@]}"; do
            echo "Checking $apk"
            unzip -t "$apk" >/dev/null
            unzip -l "$apk" > "$RUNNER_TEMP/apk-list.txt"

            if ! grep -Eqi \
              'libQt6(Core|Gui|Widgets)|libpyside6|libshiboken6|PySide6' \
              "$RUNNER_TEMP/apk-list.txt"; then
              echo "::error::Qt/PySide6 runtime not detected in $apk"
              exit 1
            fi

            cp "$apk" output/
          done

          ls -lh output/*.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Management-System-PySide6-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Management-System-Build-Diagnostics
          path: |
            .buildozer/**
            buildozer.spec
            buildozer.spec.kivy-legacy-disabled
            requirements-kivy-legacy.txt
            *.log
          if-no-files-found: ignore
          retention-days: 7
