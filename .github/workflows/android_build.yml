name: Build HSE Management APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      P4A_freetype_DIR: /home/runner/freetype-source
      PACKAGES_PATH: /home/runner/.buildozer/android/packages

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. PYTHON 3.11
      # =========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =========================================================
      # 3. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 4. SYSTEM DEPENDENCIES
      # =========================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            wget \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            gettext \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            ninja-build \
            ccache


      # =========================================================
      # 5. BUILD TOOLS
      # =========================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.34


      # =========================================================
      # 6. ACCEPT ANDROID LICENSES
      # =========================================================

      - name: Accept Android SDK licenses
        run: |
          echo "=============================================="
          echo "ANDROID SDK LICENSES"
          echo "=============================================="

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -name sdkmanager \
              -type f \
              | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          echo "Android SDK licenses accepted."


      # =========================================================
      # 7. VERIFY BUILD TOOLS
      # =========================================================

      - name: Verify Android SDK
        run: |
          echo "=============================================="
          echo "ANDROID SDK CHECK"
          echo "=============================================="

          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Installed Build Tools:"
          ls -la "$ANDROID_HOME/build-tools"

          echo ""
          echo "AIDL files:"
          find "$ANDROID_HOME/build-tools" \
            -name aidl \
            -type f \
            -print

          echo ""
          echo "ADB:"
          find "$ANDROID_HOME/platform-tools" \
            -name adb \
            -type f \
            -print

          AIDL="$ANDROID_HOME/build-tools/37.0.0/aidl"

          if [ ! -f "$AIDL" ]; then
            echo "ERROR: Build-Tools 37.0.0 AIDL not found."
            exit 1
          fi

          echo ""
          echo "AIDL found:"
          echo "$AIDL"

          echo ""
          echo "Android SDK verification PASSED."


      # =========================================================
      # 8. VERIFY PROJECT FILES
      # =========================================================

      - name: Verify project
        run: |
          echo "=============================================="
          echo "PROJECT CHECK"
          echo "=============================================="

          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "requirements.txt:"
          cat requirements.txt

          echo ""
          echo "buildozer.spec:"
          cat buildozer.spec

          test -f main.py
          test -f buildozer.spec
          test -f requirements.txt

          echo ""
          echo "Project verification PASSED."


      # =========================================================
      # 9. PYTHON SYNTAX
      # =========================================================

      - name: Check Python syntax
        run: |
          python -m py_compile main.py

          echo "main.py syntax check PASSED."


      # =========================================================
      # 10. CHECK REQUIREMENTS
      # =========================================================

      - name: Check Android requirements
        run: |
          echo "=============================================="
          echo "DEPENDENCY CHECK"
          echo "=============================================="

          if grep -Eiq \
            'openpyxl|reportlab|python-docx|docx' \
            requirements.txt; then

            echo "ERROR: Removed package found."
            cat requirements.txt
            exit 1
          fi

          if grep -Eiq \
            'requests|charset-normalizer|charset_normalizer|certifi|urllib3|idna' \
            requirements.txt; then

            echo "ERROR: Network dependency found."
            cat requirements.txt
            exit 1
          fi

          echo "Requirements check PASSED."


      # =========================================================
      # 11. PREPARE FREETYPE
      # =========================================================

      - name: Prepare FreeType
        run: |
          echo "=============================================="
          echo "FREETYPE"
          echo "=============================================="

          rm -rf "$HOME/freetype-source"

          git clone \
            --depth 1 \
            --branch VER-2-14-1 \
            https://github.com/freetype/freetype.git \
            "$HOME/freetype-source"

          test -f "$HOME/freetype-source/CMakeLists.txt"

          echo "FreeType source prepared."


      # =========================================================
      # 12. CONFIGURE FREETYPE
      # =========================================================

      - name: Configure FreeType
        run: |
          echo "P4A_freetype_DIR=$HOME/freetype-source" >> "$GITHUB_ENV"

          export P4A_freetype_DIR="$HOME/freetype-source"

          echo "P4A_freetype_DIR:"
          echo "$P4A_freetype_DIR"

          test -d "$P4A_freetype_DIR"


      # =========================================================
      # 13. CLEAN OLD BUILD CACHE
      # =========================================================

      - name: Clean old Buildozer cache
        run: |
          echo "=============================================="
          echo "CLEANING OLD BUILD"
          echo "=============================================="

          rm -rf .buildozer/android/platform/build-arm64-v8a/build/python-installs

          rm -rf .buildozer/android/platform/build-arm64-v8a/dists

          echo "Old Python installation and distribution cache removed."


      # =========================================================
      # 14. SHOW ENVIRONMENT
      # =========================================================

      - name: Show build environment
        run: |
          echo "=============================================="
          echo "BUILD ENVIRONMENT"
          echo "=============================================="

          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_NDK_HOME:"
          echo "$ANDROID_NDK_HOME"

          echo ""
          echo "P4A_freetype_DIR:"
          echo "$P4A_freetype_DIR"


      # =========================================================
      # 15. BUILD APK
      # =========================================================

      - name: Build APK
        run: |
          echo "=============================================="
          echo "BUILDING HSE MANAGEMENT APK"
          echo "=============================================="

          export P4A_freetype_DIR="$HOME/freetype-source"

          buildozer -v android debug


      # =========================================================
      # 16. FIND APK
      # =========================================================

      - name: Find APK
        if: success()
        run: |
          echo "=============================================="
          echo "APK RESULT"
          echo "=============================================="

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          ls -lh bin/*.apk


      # =========================================================
      # 17. UPLOAD APK
      # =========================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Management-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 18. UPLOAD LOGS IF FAILURE
      # =========================================================

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Build-Logs
          path: |
            .buildozer/android/platform/build-arm64-v8a/**/*.log
            .buildozer/android/platform/build-arm64-v8a/**/config.log
          if-no-files-found: ignore
          retention-days: 7