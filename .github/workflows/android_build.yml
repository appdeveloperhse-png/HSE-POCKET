name: Build HSE Management System APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            gettext \
            autopoint


      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer
          pip install "Cython==0.29.34"


      - name: Show versions
        run: |
          python --version
          buildozer --version
          java -version


      - name: Clean old Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin


      # ==========================================================
      # DOWNLOAD FREETYPE FROM GITHUB
      # NO SAVANNAH DOWNLOAD
      # ==========================================================
      - name: Prepare FreeType
        run: |
          set -e

          FREETYPE_DIR="$HOME/freetype-source"

          echo "=========================================="
          echo "Preparing FreeType 2.14.1"
          echo "=========================================="

          rm -rf "$FREETYPE_DIR"

          git clone \
            --depth 1 \
            --branch VER-2-14-1 \
            https://github.com/freetype/freetype.git \
            "$FREETYPE_DIR"

          echo "=========================================="
          echo "Checking FreeType"
          echo "=========================================="

          test -d "$FREETYPE_DIR"
          test -d "$FREETYPE_DIR/src"
          test -d "$FREETYPE_DIR/include"
          test -f "$FREETYPE_DIR/CMakeLists.txt"

          echo "FreeType location:"
          echo "$FREETYPE_DIR"

          echo "FreeType files:"
          ls -lah "$FREETYPE_DIR"

          echo "=========================================="
          echo "FreeType READY"
          echo "=========================================="


      # ==========================================================
      # BUILD APK
      #
      # IMPORTANT:
      # Set P4A_freetype_DIR INSIDE the shell.
      #
      # Do NOT use:
      # ${{ env.HOME }}
      # ==========================================================
      - name: Build APK
        run: |
          set -e

          export P4A_freetype_DIR="$HOME/freetype-source"

          echo "=========================================="
          echo "P4A FREETYPE SOURCE"
          echo "=========================================="

          echo "HOME = $HOME"
          echo "P4A_freetype_DIR = $P4A_freetype_DIR"

          test -d "$P4A_freetype_DIR"
          test -d "$P4A_freetype_DIR/src"
          test -d "$P4A_freetype_DIR/include"

          echo "=========================================="
          echo "Starting Buildozer"
          echo "=========================================="

          buildozer -v android debug


      - name: Search APK
        if: always()
        run: |
          echo "=========================================="
          echo "APK SEARCH"
          echo "=========================================="

          find . -type f -name "*.apk" -print

          echo "=========================================="
          echo "BIN DIRECTORY"
          echo "=========================================="

          ls -lah bin 2>/dev/null || true


      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Management-System-APK
          path: bin/*.apk
          if-no-files-found: error
